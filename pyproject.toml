[project]
name = "pupil-brightness-tracker"
version = "0.1.0"
description = "Stream gaze data from Pupil Core and analyze brightness at gaze point"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgpack>=1.1.2",
    "numpy>=2.4.0",
    "opencv-python>=4.11.0.86",
    "pyzmq>=27.1.0",
]

[project.scripts]
pupil-tracker = "pupil_tracker.main:main"
gaze-player = "pupil_tracker.player:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pupil_tracker"]
