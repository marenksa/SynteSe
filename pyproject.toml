[project]
name = "SynteSe"
version = "0.1.0"
description = "Stream gaze data from Pupil Core and analyze brightness at gaze point"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgpack>=1.1.2",
    "numpy>=2.4.0",
    "opencv-python>=4.11.0.86",
    "pyzmq>=27.1.0",
]

[project.scripts]
pupil-tracker = "base.tracker:main"
pupil-player = "base.player:main"
new-prototype = "prototypes.new_prototype:main"

[dependency-groups]
dev = [
    "opencv-stubs>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["base", "prototypes"]

[tool.ty.environment]
python = ".venv"
